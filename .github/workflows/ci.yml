name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: terragate_ci
          POSTGRES_PASSWORD: ci_only_password
          POSTGRES_DB: terragate_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U terragate_ci -d terragate_ci"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: apps/api/requirements.txt
      - run: python -m pip install --upgrade pip
      - run: pip install -r requirements.txt
      - name: Validate Alembic migrations
        run: |
          DATABASE_URL=sqlite:///./ci_migrations.db \
          ARTIFACT_STORAGE_DIR=./ci_artifacts \
          alembic upgrade head
      - run: pytest -q
        env:
          TEST_POSTGRES_URL: postgresql+psycopg://terragate_ci:ci_only_password@127.0.0.1:5432/terragate_ci

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run build

  infrastructure:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.9"
      - name: Check Terraform formatting
        run: terraform fmt -check -recursive infra/terraform
      - name: Validate public demo Terraform
        working-directory: infra/terraform/aws-public-demo
        run: |
          terraform init -backend=false -input=false
          terraform validate
