services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cloudops
      POSTGRES_USER: cloudops
      POSTGRES_PASSWORD: cloudops
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloudops -d cloudops"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: ..
      dockerfile: infra/Dockerfile.api
    environment:
      DATABASE_URL: postgresql+psycopg://cloudops:cloudops@postgres:5432/cloudops
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5.4-mini}
      LANGSMITH_API_KEY: ${LANGSMITH_API_KEY:-}
      LANGSMITH_PROJECT: ${LANGSMITH_PROJECT:-cloudops-ai-command-center}
      LANGSMITH_TRACING: ${LANGSMITH_TRACING:-true}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ARTIFACT_STORAGE_DIR: /app/artifacts
      APP_ENV: development
      CORS_ORIGINS: http://localhost:3000,http://127.0.0.1:3000
    ports:
      - "8000:8000"
    volumes:
      - ../artifacts:/app/artifacts
    depends_on:
      postgres:
        condition: service_healthy

  web:
    build:
      context: ..
      dockerfile: infra/Dockerfile.web
      args:
        NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    environment:
      NEXT_PUBLIC_API_BASE_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - api

  redis:
    image: redis:8-alpine
    ports:
      - "6379:6379"
    profiles: ["optional"]

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    profiles: ["optional"]

volumes:
  postgres-data:
